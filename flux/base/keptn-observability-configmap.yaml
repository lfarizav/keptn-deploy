---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keptn-observability-config
  namespace: keptn-system
data:
  values.yaml: |
    lifecycleOperator:
      enabled: true
      # otelCollectorUrl removed - Jaeger not required for POC per V2.1 spec

    metricsOperator:
      enabled: true
      env:
        exposeKeptnMetrics: "true"
